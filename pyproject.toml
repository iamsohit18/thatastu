[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roboteleop"
version = "0.1.0"
description = "RoboTeleop Data Platform: Safe robot teleoperation and synchronized demonstration recording"
authors = [
    {name = "RoboTeleop Team", email = "engineering@roboteleop.io"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.1",
    "opencv-python-headless>=4.9.0.80",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "black>=24.2.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
